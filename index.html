<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Faceless Reels</title>
<style>
body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}
main{max-width:700px;margin:auto;padding:20px}
.card{background:white;padding:20px;border-radius:16px;margin-bottom:15px}
input,select,button{width:100%;padding:13px;margin:8px 0;border-radius:9px;font-size:16px}
input,select{border:1px solid #ccc}
button{background:#2458d7;color:white;border:0;font-weight:bold}
#status{margin-top:12px;padding:10px}
#result{display:none}
.scene{border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:10px}
</style>
</head>

<body>
<main>

<div class="card">
<h1>AI Faceless Reels</h1>
<p>Create a short-form video plan with AI.</p>

<input id="topic" placeholder="Enter your video topic">

<select id="platform">
<option>TikTok</option>
<option>Instagram Reels</option>
<option>YouTube Shorts</option>
</select>

<select id="duration">
<option value="60">60 seconds</option>
<option value="30">30 seconds</option>
<option value="90">90 seconds</option>
</select>

<select id="style">
<option>Educational</option>
<option>Storytelling</option>
<option>Motivational</option>
<option>News</option>
</select>

<input id="audience" placeholder="Audience, e.g. beginners">

<button onclick="generate()">Generate Video Plan</button>

<div id="status"></div>
</div>

<div id="result" class="card">
<h2 id="title"></h2>
<h3>Hook</h3>
<p id="hook"></p>
<h3>Narration</h3>
<p id="narration"></p>
<h3>Scenes</h3>
<div id="scenes"></div>
<h3>Call to Action</h3>
<p id="cta"></p>
</div>

</main>

<script>
const WORKER =
"https://faceless-reels-api.chimeradragonfly.workers.dev";

async function generate(){

const topic=document.getElementById("topic").value.trim();

if(!topic){
document.getElementById("status").textContent=
"Please enter a topic first.";
return;
}

document.getElementById("status").textContent=
"Generating...";

try{

const response=await fetch(WORKER,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
topic:topic,
platform:document.getElementById("platform").value,
duration:Number(document.getElementById("duration").value),
style:document.getElementById("style").value,
audience:document.getElementById("audience").value
})
});

const data=await response.json();

if(!data.success){
throw new Error(data.error||"AI Worker error");
}

let video=data.video;

if(typeof video==="string"){
try{
video=JSON.parse(video);
}catch{
video={
title:"Generated Video",
hook:"",
narration:video,
scenes:[],
cta:""
};
}
}

document.getElementById("title").textContent=
video.title||"Generated Video";

document.getElementById("hook").textContent=
video.hook||"";

document.getElementById("narration").textContent=
video.narration||"";

document.getElementById("cta").textContent=
video.cta||"";

const scenes=document.getElementById("scenes");
scenes.innerHTML="";

(video.scenes||[]).forEach((s,i)=>{

const div=document.createElement("div");
div.className="scene";

div.innerHTML=
"<b>Scene "+(s.scene||i+1)+"</b>"+
"<p><b>Time:</b> "+(s.duration||"")+"</p>"+
"<p><b>Visual:</b> "+(s.visual||"")+"</p>"+
"<p><b>Voiceover:</b> "+(s.voiceover||"")+"</p>"+
"<p><b>Caption:</b> "+(s.caption||"")+"</p>";

scenes.appendChild(div);

});

document.getElementById("result").style.display="block";
document.getElementById("status").textContent=
"Video plan generated successfully.";

}catch(error){

document.getElementById("status").textContent=
"Error: "+error.message;

}

}
</script>

</body>
  </html>
